<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GAIA CITY: DETECTIVE</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="field">
    <div id="bg"></div>
    <div id="hintBar"></div>
    <div id="hero"><div id="bubble" class="sbub"><span></span></div><img id="heroImg" alt=""><div class="heroTag"><span id="blockTag"></span></div></div>
    <div id="enemies"></div>
    <div id="fx"></div>
    <div id="flash"></div><div id="banner"></div>
  </div>

  <div id="hud">
    <div class="hudbox" id="hpBox"><div class="bar hp"><span class="trk"><i id="hpFill"></i></span><b id="hpTxt"></b></div></div>
    <div class="hudbox" id="energyBox"><div id="energy"></div></div>
    <div class="hudbox stat"><div class="bar dopa" id="dopaBar"><span class="trk"><i id="dopaFill"></i></span><b id="dopaTxt"></b></div></div>
    <div class="hudbox stat"><div class="bar tight"><span class="trk"><i id="tightFill"></i></span><b id="tightTxt"></b></div></div>
    <div class="hudbox stat"><div class="bar lube"><span class="trk"><i id="lubeFill"></i></span><b id="lubeTxt"></b></div></div>
    <div class="hudbox" id="turnBox"><span class="ico ic" data-ic="turn">TURN</span><b id="turnNo">1</b></div>
    <button id="fsBtn" class="bagbtn fsbtn">전체화면</button><button id="bagBtn" class="bagbtn">가방</button><button id="muteBtn" title="소리">🔊</button><button id="devBtn" title="개발용"><span class="ic" data-ic="settings">⚙</span></button>
  </div>

  <div class="pile" id="pileDraw"><span class="ic" data-ic="pile_draw">🂠</span><b id="nDraw">0</b><span class="pl">뽑을 카드</span></div>
  <div class="pile" id="pileDisc"><span class="ic" data-ic="pile_discard">🂠</span><b id="nDisc">0</b><span class="pl">버린 카드</span><em id="nExh"></em></div>

  <div id="bottom"><div id="hand"></div></div>
  <button id="endTurn">턴 종료</button>

  <div id="map" class="hidden">
    <div id="mapPan"></div>
    <div id="mapInfo"><span class="s1"></span><span class="s2"></span><span class="s3"></span></div>
    <button id="mapFs" class="bagbtn fsbtn">전체화면</button><button id="mapBag" class="bagbtn">가방</button>
    <div id="mapHint">손가락으로 밀어서 지도를 움직이세요</div>
    <div id="mapCard" class="hidden"><b id="mcName"></b><span id="mcSub"></span><div class="row"><button id="mcClose">닫기</button><button id="mcGo">출동</button></div></div>
  </div>

  <div id="shop" class="hidden"></div>

  <div id="panel" class="hidden"><div class="box"><h2 id="pnTitle"></h2><p id="pnMsg"></p><div id="pnCards"></div><div class="row" id="pnBtns"></div></div></div>

  <div id="dev" class="hidden">
    <h4>개발용 패널</h4>
    <label>전투 <select id="devEnc"></select></label>
    <button id="devStart">시작</button>
    <div class="row"><button data-dev="dopa30">도파민 +30</button><button data-dev="dopa100">도파민 100</button><button data-dev="tight10">조임력 +10</button><button data-dev="lube50">윤활도 +50</button></div>
    <button id="devReset">런 초기화(새로 시작)</button>
    <button id="devItems">아이템 6개 받기(시험용)</button>
    <label>손패에 추가 <select id="devCard"></select></label>
    <button id="devAdd">추가</button>
  </div>

  <div id="overlay" class="hidden"><div class="box"><h2 id="ovTitle"></h2><p id="ovMsg"></p><div class="row"><button id="ovMap">지도로</button><button id="ovAgain">같은 전투 다시</button><button id="ovDev">전투 고르기</button></div></div></div>
</div>

<script src="data/config.js"></script>
<script src="data/cards.js"></script>
<script src="data/enemies.js"></script>
<script src="data/dialogue.js"></script>
<script src="data/map.js"></script>
<script src="data/flow.js"></script>
<script src="data/items.js"></script>
<script src="js/engine.js"></script>
<script src="js/icons.js"></script>
<script src="js/sfx.js"></script>
<script src="js/run.js"></script>
<script src="js/map.js"></script>
<script src="js/inv.js"></script>
<script src="js/shop.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
