name: GAIA DETECTIVE APK
on:
  push:
    branches: [main, gaia-detective-assets]
    paths: ['gaia-detective/android/**', 'gaia-detective/tools/build_android_web.py', '.github/workflows/detective-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: {group: gaia-detective-apk, cancel-in-progress: true}
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gaia-detective-gradle-${{ hashFiles('gaia-detective/android/**/*.gradle', 'gaia-detective/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gaia-detective-gradle-
      - name: 게임 파일 묶음 만들기
        run: python3 gaia-detective/tools/build_android_web.py
      - name: 게임 코드 문법 검사
        run: for f in gaia-detective/js/*.js gaia-detective/data/*.js; do node --check "$f"; done
      - name: APK 컴파일 및 단위 검사
        run: cd gaia-detective/android && chmod +x gradlew && ./gradlew testDebugUnitTest assembleDebug --no-daemon
      - name: APK 게시
        uses: softprops/action-gh-release@v2
        with:
          tag_name: detective-app-latest
          name: GAIA CITY DETECTIVE 최신 APK
          body: 앱 자체(진동·저장 기능)가 바뀐 때만 새 APK를 덮어 설치하면 됩니다. 게임 내용 수정은 앱을 다시 켜면 자동으로 적용됩니다.
          make_latest: false
          files: gaia-detective/android/app/build/outputs/apk/debug/gaia-detective.apk
