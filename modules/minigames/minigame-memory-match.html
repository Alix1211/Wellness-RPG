<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GAIA CITY LIFE · 짝맞추기</title>
<!-- 설정: GAME_CONFIG = {roomId:'test',kind:'memory',difficulty:1,location:'street',goal:null,images:[],lines:{}}.
센터 center / 회사 company / 거리 street. 난이도 1:12장·3초미리보기, 2:16장·1.5초, 3:20장·미리보기없음. 모두90초.
images에 앞면 그림 URL 또는 data URI를 순서대로 전달하면 번호 대신 일괄 표시. 부족한 그림은 번호로 채움.
선택 설정 cardBacks:{center,company,street}로 뒷면 교체 가능. 기본은 사용자가 제공한 세 그림 내장.
본체: wellness-ready → wellness-start 대기 → wellness-result 1회. wellness-start 재수신 시 완전 초기화.
단독: 장소·난이도 선택, 시작·다시하기·닫기. 저장/음향/외부요청 없음(설정에서 외부 그림 URL을 넘긴 경우 제외).
-->
<style>
:root{color-scheme:light;--ink:#654558;--accent:#ac6eaa;--soft:#eee1f0;--border:#dbc5d8;--gap:8px}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-width:280px;width:100%;height:100%;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:var(--ink);background:#f8f1f3;overscroll-behavior:none}body{background:radial-gradient(ellipse at 15% 0%,#fffcf7 0,transparent 55%),linear-gradient(145deg,#fff1f3,#f1edf8 65%,#eaf5f3);user-select:none}button{font:inherit;cursor:pointer;color:inherit;touch-action:manipulation}button:focus-visible{outline:3px solid #9a639b;outline-offset:3px}[hidden]{display:none!important}.game{width:min(100%,620px);height:100dvh;min-height:500px;margin:auto;display:flex;flex-direction:column;padding:max(12px,env(safe-area-inset-top)) 14px max(12px,env(safe-area-inset-bottom));gap:12px}.top{display:flex;align-items:center;justify-content:space-between;min-height:48px}.brand{font-size:10px;letter-spacing:.16em;color:#aa8a9b}.title{font-size:21px;letter-spacing:-.04em;font-weight:800;margin:2px 0 0}.pill{font-size:12px;padding:7px 13px;border-radius:20px;background:#fff9;border:1px solid #fff;white-space:nowrap}.hud{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.stat{background:#ffffffa8;border:1px solid #fff;border-radius:16px;padding:9px;text-align:center;box-shadow:0 2px 9px #81607b05}.stat small{display:block;font-size:11px;color:#a28194;margin-bottom:2px}.stat strong{font-size:21px;font-variant-numeric:tabular-nums}.timer.low{color:#c75279}.board-wrap{flex:1;min-height:360px;min-width:0;display:flex;align-items:center;justify-content:center;position:relative}.board{display:grid;gap:var(--gap);grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));grid-template-rows:repeat(var(--rows,4),minmax(0,1fr));max-width:100%;isolation:isolate}.card{position:relative;min-width:48px;min-height:72px;padding:0;border:0;background:none;border-radius:10px;perspective:700px;outline-offset:2px}.card-inner{display:block;position:absolute;inset:0;transform-style:preserve-3d;transition:transform .24s cubic-bezier(.2,.7,.2,1)}.card.open .card-inner,.card.matched .card-inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:10px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid #dbbfd0;box-shadow:0 3px 5px #81607519}.back{background:var(--soft);transform:rotateY(0deg)}.back img{display:block;width:100%;height:100%;object-fit:contain}.back-fallback{font-size:24px;color:var(--accent)}.front{transform:rotateY(180deg);background:linear-gradient(145deg,#fffefa,#fff);border:2px solid var(--border);font-size:clamp(27px,7vw,48px);font-weight:800;color:var(--accent)}.front:after{content:"";position:absolute;inset:5px;border:1px solid var(--soft);border-radius:6px;pointer-events:none}.front img{width:100%;height:100%;object-fit:contain;position:relative;z-index:1}.card.matched .front{border-color:#9ac5b2;background:#f4fff9;box-shadow:0 0 0 2px #b9dfcb55}.card.just-matched{animation:match-pop .38s ease-out}.card.wrong{animation:nope .25s ease-in-out}.card:disabled{cursor:default}.foot{min-height:19px;display:flex;align-items:center;gap:12px}.progress{height:5px;border-radius:9px;background:#e7dbe5;overflow:hidden;flex:1}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#d896b2,#9ecfc0);transition:width .25s}.state{font-size:11px;min-width:50px;text-align:right;color:#9a7a8d}.veil{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:20px;background:#f9f2f1d9;backdrop-filter:blur(7px);overflow:auto}.panel{width:min(100%,350px);border-radius:27px;background:linear-gradient(160deg,#fffdf9,#fff6fa);border:1px solid #fff;box-shadow:0 18px 65px #8b638b22;padding:27px 24px;text-align:center;position:relative}.emblem{width:67px;height:88px;border:2px solid #e8bfd4;border-radius:12px;margin:0 auto 18 /* layout-first overrides */
.game{position:relative;width:100%;max-width:none;height:100dvh;min-height:0;margin:0;gap:4px;display:grid;grid-template-columns:1fr;grid-template-rows:auto 1fr;padding:max(5px,env(safe-area-inset-top)) max(5px,env(safe-area-inset-right)) max(5px,env(safe-area-inset-bottom)) max(5px,env(safe-area-inset-left))}
.hud{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;justify-content:center;grid-template-columns:none;padding-top:3px}
.stat{background:none;border:0;box-shadow:none;border-radius:0;padding:0;display:flex;gap:4px;align-items:baseline;text-align:left}
.stat small{display:inline;margin:0;font-size:10px}
.stat strong{font-size:13px}
.pill{font-size:10px;padding:2px 8px;border-radius:10px;background:#fff9}
.board-wrap{min-height:0}
.foot{position:absolute;left:0;right:0;top:0;min-height:0;gap:0;padding:0}
.progress{height:3px;border-radius:0}
.state{display:none}
.card{min-width:30px;min-height:45px}
.face{border-radius:8px}
.front{background:var(--soft);border:1px solid var(--border)}
.front:after{display:none}
.front img,.back img{object-fit:cover;object-position:center top}
.choices{grid-template-columns:repeat(4,1fr)}
.choices#difficulties{grid-template-columns:repeat(3,1fr)}
@media(min-aspect-ratio:1/1){.game{grid-template-columns:78px 1fr;grid-template-rows:1fr}.hud{flex-direction:column;justify-content:flex-start;align-items:flex-start;gap:8px;padding:4px 2px}.stat{flex-direction:column;gap:0}.stat small{font-size:9px}.stat strong{font-size:15px}}
@media(max-height:700px){.board-wrap{min-height:0}}

function addImage(face,src,fallback){const img=new Image();img.alt='';img.draggable=false;img.onload=()=>fallback.hidden=true;img.onerror=()=>{img.remove();fallback.hidden=false;};img.src=imageUrl(src);face.append(img);}
function drawDeck(){board.replaceChildren();board.style.setProperty('--cols',level.cols);board.style.setProperty('--rows',level.rows);const back=CFG.cardBacks?.[CFG.location]||BACKS[CFG.location];for(let i=0;i<deck.length;i++){const c=deck[i],button=document.createElement('button');button.className='card';button.type='button';button.dataset.index=i;button.setAttribute('aria-label','덮인 카드 '+(i+1));const inner=document.createElement('span');inner.className='card-inner';const rear=document.createElement('span');rear.className='face back';rear.setAttribute('aria-hidden','true');const mark=document.createElement('span');mark.className='back-fallback';mark.textContent='♥';rear.append(mark);if(back)addImage(rear,back,mark);const front=document.createElement('span');front.className='face front';front.setAttribute('aria-hidden','true');const num=document.createElement('span');num.textContent=c.label;front.append(num);if(c.src)addImage(front,c.src,num);inner.append(rear,front);button.append(inner);c.el=button;button.addEventListener('click',()=>choose(i));board.append(button);}fit();}
function fit(){const gap=6,w=wrap.clientWidth,h=wrap.clientHeight,n=deck.length||level.pairs*2;let best=null;for(let cols=2;cols<=8;cols++){if(n%cols)continue;const rows=n/cols;const cw=Math.min((w-gap*(cols-1))/cols,(h-gap*(rows-1))/rows*2/3);if(!best||cw>best.cw)best={cols,rows,cw};}const cw=Math.max(40,best.cw);board.style.setProperty('--cols',best.cols);board.style.setProperty('--rows',best.rows);board.style.setProperty('--gap',gap+'px');board.style.width=(cw*best.cols+gap*(best.cols-1))+'px';board.style.height=(cw*1.5*best.rows+gap*(best.rows-1))+'px';}
function visible(c,on){c.el.classList.toggle('open',on);c.el.setAttribute('aria-label',on?'카드 '+c.label:'덮인 카드 '+(+c.el.dataset.index+1));}
function hud(){const left=Math.max(0,90-elapsed/1000);$('timer').textContent=Math.ceil(left);$('timer').classList.toggle('low',left<=15);$('pairs').textContent=matches+' / '+level.pairs;$('misses').textContent=misses;$('progress').style.width=(matches/level.pairs*100)+'%';$('state').textContent=phase==='preview'?'기억하세요':phase==='playing'?'':phase==='done'?'완료':'준비';}
function start(){cancelAnimationFrame(raf);raf=0;last=null;Object.assign(CFG,window.GAME_CONFIG||{});normalize();applyTheme();phase=level.preview?'preview':'playing';matches=misses=elapsed=mismatchLeft=0;previewLeft=level.preview;selected=[];reported=false;lastResult=null;$('intro').hidden=true;$('result').hidden=true;$('signal').hidden=true;deck=makeDeck();drawDeck();if(previewLeft)deck.forEach(c=>visible(c,true));hud();raf=requestAnimationFrame(tick);}
function choose(index){if(phase!=='playing'||selected.length>=2)return;const c=deck[index];if(c.matched||selected.includes(index))return;visible(c,true);selected.push(index);if(selected.length<2)return;const [a,b]=selected.map(i=>deck[i]);if(a.key===b.key){matches++;for(const item of [a,b]){item.matched=true;item.el.classList.add('matched','just-matched');item.el.disabled=true;item.el.setAttribute('aria-label','찾은 짝 '+item.label);}selected=[];sfx('match');if(matches===level.pairs)finish();}else{misses++;for(const item of [a,b])item.el.classList.add('wrong');mismatchLeft=800;sfx('miss');}hud();}
function tick(now){raf=0;if(phase!=='preview'&&phase!=='playing')return;const dt=document.hidden||last===null?0:Math.max(0,now-last);last=now;if(phase==='preview'){previewLeft=Math.max(0,previewLeft-dt);if(previewLeft===0){deck.forEach(c=>visible(c,false));phase='playing';}}else{elapsed=Math.min(90000,elapsed+dt);if(mismatchLeft>0){mismatchLeft-=dt;if(mismatchLeft<=0){for(const i of selected){visible(deck[i],false);deck[i].el.classList.remove('wrong');}selected=[];}}if(elapsed>=90000){finish();return;}}hud();raf=requestAnimationFrame(tick);}
function finish(){if(reported)return;reported=true;phase='done';cancelAnimationFrame(raf);raf=0;const remaining=Math.floor(Math.max(0,90-elapsed/1000));const score=Math.max(0,matches*100+remaining*2-misses*10),max=level.pairs*100+180;const success=matches===level.pairs&&(CFG.goal===null||!Number.isFinite(+CFG.goal)||score>=+CFG.goal);lastResult={roomId:CFG.roomId,kind:CFG.kind,score,ratio:Math.min(1,score/max),success,detail:matches+' / '+level.pairs+'쌍 · 실수 '+misses+'회 · 남은 시간 '+remaining+'초'};hud();send('wellness-result',lastResult);if(success)sfx('success');if(solo){$('score').textContent=score;$('resultTitle').textContent=success?'성공!':matches===level.pairs?'목표 미달':'시간 초과';$('resultEmblem').textContent=success?'♥':'…';$('resultDetails').textContent=lastResult.detail;$('resultLine').textContent=success?(CFG.lines.win||'다 찾았다!'):(CFG.lines.lose||(matches===level.pairs?'조금만 더!':'시간 초과…'));$('result').hidden=false;}}
function close(){cancelAnimationFrame(raf);raf=0;phase='ready';selected=[];send('wellness-close');$('result').hidden=true;$('intro').hidden=false;for(const c of deck)visible(c,false);hud();}
normalize();applyTheme();deck=makeDeck();drawDeck();hud();if(!solo){document.body.classList.add('embedded');$('intro').hidden=true;}
$('start').onclick=start;$('again').onclick=start;$('close').onclick=close;
$('locations').addEventListener('click',e=>{const b=e.target.closest('[data-location]');if(!b)return;CFG.location=b.dataset.location;normalize();applyTheme();deck=makeDeck();drawDeck();});
$('difficulties').addEventListener('click',e=>{const b=e.target.closest('[data-difficulty]');if(!b)return;CFG.difficulty=+b.dataset.difficulty;normalize();applyTheme();deck=makeDeck();drawDeck();hud();});
addEventListener('message',e=>{if(!solo&&e.source===parent&&e.data?.type==='wellness-start')start();});
document.addEventListener('visibilitychange',()=>{last=null;});addEventListener('pagehide',()=>{cancelAnimationFrame(raf);raf=0;});new ResizeObserver(fit).observe(wrap);
if(!solo)send('wellness-ready');
})();
</script></body></html>
