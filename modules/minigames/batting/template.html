<!-- 기본 GAME_CONFIG:{roomId:'test',kind:'batting',location:'center',difficulty:1,goal:null,images:[],lines:{}}.

본체: wellness-ready → wellness-start(재시작도 동일) → wellness-result 1회. 본체 시작/결과창 없음.
선택 설정: images[0]배경/[1]대기/[2]비행/[3~]스윙컷, sounds:{miss,normal,perfect,hit_slap,hit_punch}.

<canvas id="stage" aria-label="컨베이어 배팅 게임. 캐릭터가 배트에 닿을 순간 터치하세요." tabindex="0"></canvas>

<script>
(()=>{'use strict';
const ASSETS=/*ASSETS*/;
const AUDIO=/*AUDIO*/;
const CFG=Object.assign({roomId:'test',kind:'batting',location:'center',difficulty:1,goal:null,images:[],lines:{}},window.GAME_CONFIG||{});
const solo=parent===window,$=id=>document.getElementById(id),canvas=$('stage'),ctx=canvas.getContext('2d');
const RULES={1:{speed:150,window:.20,amplitude:0,goal:240},2:{speed:180,window:.16,amplitude:35,goal:360},3:{speed:215,window:.13,amplitude:58,goal:456}};
const PLACES={center:{name:'센터',row:0,wall:'#f5e7f5',trim:'#c6acd7'},company:{name:'회사',row:2,wall:'#e8edf8',trim:'#afbdd5'},street:{name:'거리',row:1,wall:'#fff0e3',trim:'#d7b3a5'}};
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x)),mix=(a,b,t)=>a+(b-a)*t,ease=t=>1-Math.pow(1-clamp(t,0,1),3),rand=(a,b)=>a+Math.random()*(b-a);
let W=720,H=1485,loaded=false,phase='ready',age=0,totalTime=0,last=null,raf=0,paused=false,mute=false,score=0,round=0,combo=0,records=[],reported=false,hero=null,swing=null,grade=null,flight=null,particles=[],stickers=[],trails=[],rings=[],shake=0,flash=0,stopLeft=0,camera=0,returnCamera=0,peak=0,roundSerial=0,readyCount=0,precision=0,shotDistance=0;
const CHEER_IDS={perfect:['nice','sky','againride','best'],good:['onemore','nice'],bad:['farther','short']};
const CHEERS={perfect:['나이스샤~! ♥','저 하늘까지 가요~! ♥','이 맛에 또 타죠~! ♥','최고예요오오~! ♥'],good:['좋아요~! 한 번 더! ♥','나이스샤~! ♥'],bad:['앗, 다음엔 더 멀리~!','아앗~ 짧아도 좋아요! ♥']};
let images={},rule=RULES[1],place=PLACES.center;
const stars=Array.from({length:50},()=>({x:rand(0,720),y:rand(0,1800),r:rand(1,3),a:rand(.2,.7)}));
function send(type,data={}){if(!solo)parent.postMessage({type,...data},'*');else if(type==='wellness-result'||type==='wellness-close'){$('signal').hidden=false;$('signal').textContent=type==='wellness-result'?'결과 전송 · '+data.score+'점':'닫힘';}}
const Sound=(()=>{let ac=null,master=null;const buffers=new Map(),starts=new Map(),pool=[];function unlock(){if(!solo||mute)return;try{if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)({latencyHint:"interactive"});master=ac.createGain();master.gain.value=.65;master.connect(ac.destination);}if(ac.state!=='running')ac.resume().catch(()=>{});for(const k of Object.keys(AUDIO))load(k);}catch{}}
// Build short impact buffers once; playback begins at sample zero with no leading silence.
function makeHit(k){const heavy=k==='hit_punch',rate=ac.sampleRate,duration=heavy?.24:.18,b=ac.createBuffer(1,Math.ceil(rate*duration),rate),out=b.getChannelData(0);let phase=0,seed=heavy?1947:8123,low=0;
 for(let i=0;i<out.length;i++){const t=i/rate;seed=(Math.imul(seed,1664525)+1013904223)|0;const noise=(seed>>>0)/2147483648-1;low+=.22*(noise-low);phase+=2*Math.PI*(heavy?145+230*Math.exp(-t*55):220+350*Math.exp(-t*75))/rate;const attack=Math.min(1,(i+1)/(rate*.001));out[i]=Math.tanh((Math.sin(phase)*Math.exp(-t*(heavy?20:28))*.82+(noise-low)*Math.exp(-t*48)*1.15+Math.sin(phase*2.7)*Math.exp(-t*38)*.35+low*Math.exp(-t*35)*.5)*attack*1.35)*.83;}
 return b;}
function load(k){if(ac&&(k==='hit_slap'||k==='hit_punch')){if(!buffers.has(k)){buffers.set(k,Promise.resolve(makeHit(k)));starts.set(k,0);}return buffers.get(k);}if(!ac||!AUDIO[k])return Promise.resolve(null);if(!buffers.has(k))buffers.set(k,Promise.resolve().then(()=>{const raw=atob(AUDIO[k].split(',')[1]);return ac.decodeAudioData(Uint8Array.from(raw,c=>c.charCodeAt(0)).buffer);}).then(b=>{if(!b)return null;let first=b.length;for(let c=0;c<b.numberOfChannels;c++){const samples=b.getChannelData(c);for(let i=0;i<first;i++)if(Math.abs(samples[i])>.01){first=i;break;}}starts.set(k,first<b.length?Math.max(0,first/b.sampleRate-.002):0);return b;}).catch(()=>null));return buffers.get(k);}
let epoch=0;async function play(k,voice=false,fade=false){if(!solo||mute||document.hidden)return;const id=epoch;unlock();const b=await load(k);if(!b||id!==epoch||mute||paused||document.hidden)return;try{if(voice)for(const p of [...pool])if(p.voice){try{p.node.stop();}catch{}}while(pool.length>=5){const p=pool.shift();try{p.node.stop();p.node.disconnect();p.gain.disconnect();}catch{}}const node=ac.createBufferSource(),gain=ac.createGain();node.buffer=b;gain.gain.value=voice?.60:.95;const startAt=ac.currentTime+(voice?.075:0);if(fade){const now=startAt;gain.gain.setValueAtTime(.60,now);gain.gain.exponentialRampToValueAtTime(.025,now+1.2);gain.gain.linearRampToValueAtTime(0,now+1.48);}node.connect(gain).connect(master);const item={node,gain,voice};pool.push(item);node.onended=()=>{const i=pool.indexOf(item);if(i>=0)pool.splice(i,1);node.disconnect();gain.disconnect();};node.start(startAt,starts.get(k)||0);}catch{}}
function stop(){epoch++;for(const p of pool.splice(0))try{p.node.stop();p.node.disconnect();p.gain.disconnect();}catch{}}
function suspend(){ac?.suspend().catch(()=>{});}return{unlock,play,stop,suspend,get state(){return ac?.state||'uninitialized'},get active(){return pool.length}};})();
function sfx(name){if(!solo)send('wellness-sfx',{name});}
function settings(){if(!PLACES[CFG.location])CFG.location='center';CFG.difficulty=[1,2,3].includes(+CFG.difficulty)?+CFG.difficulty:1;rule=RULES[CFG.difficulty];place=PLACES[CFG.location];document.querySelectorAll('[data-location]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.location===CFG.location)));document.querySelectorAll('[data-difficulty]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.difficulty===CFG.difficulty)));$('goal').textContent=place.name+' · '+['','쉬움','보통','어려움'][CFG.difficulty]+' · 목표 '+goal()+'m';}
function goal(){return CFG.goal!==null&&Number.isFinite(+CFG.goal)?+CFG.goal:rule.goal;}
function resize(){const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);H=r.height/r.width*W;draw();}
function floorY(){return H*.82;}function strikeY(){return floorY()-180;}
function syncHUD(){const n=$('attempts');n.replaceChildren();for(let i=0;i<5;i++){const d=document.createElement('span'),rec=records[i];d.className='dot'+(rec?' '+rec.grade:i===round-1&&phase!=='done'?' current':'');d.textContent=rec?(rec.grade==='perfect'?'★':rec.score):i+1;n.append(d);}$('score').textContent=score;$('combo').hidden=combo<2;if(combo>=2)$('combo').innerHTML='<b>'+combo+'</b>연속 정타!';}
function begin(){if(!loaded)return;Sound.unlock();Sound.stop();cancelAnimationFrame(raf);raf=0;last=null;Object.assign(CFG,window.GAME_CONFIG||{});settings();phase='between';age=0;totalTime=0;paused=false;score=round=combo=0;records=[];reported=false;hero=swing=grade=flight=null;precision=shotDistance=0;particles=[];stickers=[];trails=[];rings=[];shake=flash=stopLeft=camera=returnCamera=peak=0;roundSerial++;for(const id of ['intro','result','paused','signal'])$(id).hidden=true;$('hint').style.opacity='1';syncHUD();run();}
function next(){round++;phase='approach';age=0;grade=flight=null;precision=shotDistance=0;swing=null;Sound.stop();camera=0;trails=[];const cross=(860-370)/rule.speed;hero={x:860,y:floorY()-125,amp:rule.amplitude,cross,frequency:CFG.difficulty===3?3.3:2.6,serial:++roundSerial};syncHUD();}
function input(){if(paused||document.hidden||phase!=='approach')return;Sound.unlock();const dy=Math.abs((hero.y-55)-strikeY()),dt=Math.abs(hero.x-370)/rule.speed;const error=Math.max(dt/(rule.window*2.2),dy/64);precision=clamp(1-error,0,1);grade=dt<=rule.window*.5&&dy<=17?'perfect':dt<=rule.window&&dy<=33?'good':dt<=rule.window*2.2&&dy<=64?'bad':'miss';shotDistance=grade==='miss'?0:Math.round(12+108*Math.pow(precision,.8));swing={age:0};phase='windup';age=0;sfx('swing');$('hint').style.opacity='0';}
function addSticker(id,x,y,size=180,life=.8,rotation=0){stickers.push({id,x,y,size,life,max:life,rotation});}
function burst(x,y,count=50){const colors=['#f493bd','#ffc96c','#a8ded0','#b3ace8','#fff8c6'];for(let i=0;i<count;i++){const a=rand(-Math.PI,Math.PI),v=rand(80,440);particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-100,life:rand(.6,1.3),max:1.3,size:rand(6,17),spin:rand(-8,8),r:rand(-3,3),kind:i%4,color:colors[i%colors.length]});}if(particles.length>180)particles.splice(0,particles.length-180);}
function impact(){const points=shotDistance;score+=points;combo=grade==='perfect'?combo+1:0;records.push({grade,score:points,distance:points,accuracy:Math.round(precision*1000)/1000});syncHUD();phase=grade==='miss'?'miss':'flight';age=0;const x=hero.x,y=hero.y-55;
if(grade==='miss'){sfx('miss');Sound.play('miss',true);addSticker('07',clamp(x,180,550),y-150,170,.9,-.1);addSticker('16',clamp(x+100,100,620),y-10,105,.7);shake=3;return;}
const perfect=grade==='perfect',good=grade==='good';sfx(perfect?'hit_perfect':good?'hit_good':'hit_bad');Sound.play(perfect?'hit_punch':'hit_slap');Sound.play(perfect?'homerun':'normal',true,perfect);stopLeft=perfect?.105:good?.065:.035;shake=perfect?25:good?14:6;flash=perfect?.25:.12;burst(x,y,perfect?95:good?50:22);rings.push({x,y,r:12,life:.5,max:.5});rings.push({x,y,r:35,life:.7,max:.7});
const primary=perfect?'03':good?'02':'01';addSticker(primary,x,y-170,perfect?235:190,.85,rand(-.1,.1));const ids=perfect?['22']:[];ids.forEach((id,i)=>{const a=i/ids.length*Math.PI*2;addSticker(id,clamp(x+Math.cos(a)*rand(100,235),65,655),y+Math.sin(a)*rand(100,210),rand(90,145),rand(.55,1.15),rand(-.25,.25));});
flight={x0:hero.x,y0:hero.y,vx:perfect?70:good?175:135,vy:-mix(500,1900,points/120),g:perfect?135:good?450:530,duration:perfect?1.25:good?.85:.6,distance:points,cheer:CHEERS[grade][(round-1)%CHEERS[grade].length],cheerId:CHEER_IDS[grade][(round-1)%CHEER_IDS[grade].length],trailAt:0};}
function finish(){if(reported)return;reported=true;phase='done';age=0;Sound.stop();const success=score>=goal(),data={roomId:CFG.roomId,kind:CFG.kind,score,ratio:score/600,success,detail:'정타 '+records.filter(r=>r.grade==='perfect').length+' / 5 · 최장 '+Math.max(0,...records.map(r=>r.distance))+'m',rounds:records.map(r=>({...r}))};if(success)sfx('success');send('wellness-result',data);syncHUD();if(solo){$('total').textContent=score;$('resultTitle').textContent=success?'성공!':'한 번 더?';$('resultCrest').textContent=score===600?'★':'✦';$('record').textContent='최장 비거리 '+Math.max(0,...records.map(r=>r.distance))+'m';$('summary').textContent=records.map(r=>r.score).join(' + ')+' = '+score+'m';$('resultLine').textContent=success?(CFG.lines.win||'오늘 타격감, 끝내주네요!'):(CFG.lines.lose||'다음엔 정확히 부탁드려요…');$('result').hidden=false;}cancelAnimationFrame(raf);raf=0;}
function settle(){returnCamera=camera;phase='between';age=0;hero=null;flight=null;trails=[];}
function update(dt){if(paused)return;totalTime+=dt;shake=Math.max(0,shake-dt*30);flash=Math.max(0,flash-dt*.9);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=370*dt;p.r+=p.spin*dt;p.life-=dt;}particles=particles.filter(p=>p.life>0);for(const s of stickers)s.life-=dt;stickers=stickers.filter(s=>s.life>0);for(const r of rings){r.r+=240*dt;r.life-=dt;}rings=rings.filter(r=>r.life>0);
if(stopLeft>0){stopLeft-=dt;return;}age+=dt;if(swing)swing.age+=dt;
if(phase==='between'){camera=returnCamera*(1-ease(age/.3));if(age>.4){if(round>=5)finish();else next();}}
else if(phase==='approach'){hero.x=860-rule.speed*age;hero.y=floorY()-125+hero.amp*Math.sin((age-hero.cross)*hero.frequency);if(hero.x<220){grade='miss';swing={age:.3};impact();}}
else if(phase==='windup'){if(age>=.075)impact();}
else if(phase==='miss'){hero.x-=rule.speed*2.2*dt;hero.y+=Math.sin(totalTime*20)*.3;if(age>.95)settle();}
else if(phase==='flight'){const t=age;hero.x=flight.x0+flight.vx*t;hero.y=flight.y0+flight.vy*t+.5*flight.g*t*t;if(grade==='perfect'){camera=ease((t-.1)/1.05)*H*.62;peak=Math.max(peak,flight.y0-hero.y);if(t-flight.trailAt>.035){flight.trailAt=t;trails.push({x:hero.x,y:hero.y,t});if(trails.length>15)trails.shift();}if(t>.3&&Math.random()<.3){particles.push({x:hero.x+rand(-35,35),y:hero.y+100,vx:rand(-40,40),vy:rand(80,180),life:.7,max:.7,size:rand(5,12),spin:1,r:0,kind:1,color:'#ffe5a7'});}}if(t>=flight.duration)settle();}}
function run(){if(raf||paused||phase==='done')return;raf=requestAnimationFrame(tick);}
function tick(now){raf=0;const dt=document.hidden||last===null?0:Math.min(.05,Math.max(0,(now-last)/1000));last=now;if(!document.hidden&&!paused){update(dt);draw();}if(!paused&&phase!=='done')run();}
function rect(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.stroke();}}
function text(s,x,y,size,color='#79516b',align='center'){ctx.font='800 '+size+'px system-ui,sans-serif';ctx.textAlign=align;ctx.textBaseline='middle';ctx.lineWidth=5;ctx.strokeStyle='#ffffffd9';ctx.strokeText(s,x,y);ctx.fillStyle=color;ctx.fillText(s,x,y);}
function sprite(key,x,y,w,h,anchorX=.5,anchorY=1,rotation=0,alpha=1){const im=images[key];ctx.save();ctx.translate(x,y);ctx.rotate(rotation);ctx.globalAlpha*=alpha;if(im?.naturalWidth)ctx.drawImage(im,-w*anchorX,-h*anchorY,w,h);else{rect(-w*.24,-h*.7,w*.48,h*.7,30,'#bda8d5');ctx.fillStyle='#fff2cf';ctx.beginPath();ctx.arc(0,-h*.8,w*.19,0,Math.PI*2);ctx.fill();}ctx.restore();}
function cloud(x,y,s=1,alpha=1){ctx.save();ctx.globalAlpha*=alpha;ctx.fillStyle='#ffffffd4';ctx.beginPath();ctx.ellipse(x,y,65*s,21*s,0,0,7);ctx.ellipse(x-30*s,y-10*s,32*s,27*s,0,0,7);ctx.ellipse(x+15*s,y-20*s,38*s,32*s,0,0,7);ctx.fill();ctx.restore();}
function drawBackground(){const lift=clamp(camera/H,0,1),g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,lift>.2?'#d5cced':'#eee5f8');g.addColorStop(.6,'#e5f4f9');g.addColorStop(1,'#fff4e9');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
if(images.background?.naturalWidth){const im=images.background,s=Math.max(W/im.width,H/im.height);ctx.globalAlpha=.35;ctx.drawImage(im,(W-im.width*s)/2,(H-im.height*s)/2,im.width*s,im.height*s);ctx.globalAlpha=1;}
for(let i=0;i<6;i++)cloud(((i*177+Math.sin(totalTime*.1+i)*20)%900)-80,H*.27+i*130+camera*.35,1+(i%2)*.5,.6);
if(lift>.1){ctx.globalAlpha=clamp(lift*1.4,0,.8);for(const s of stars){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,(s.y+camera*.12)%H,s.r,0,7);ctx.fill();}ctx.fillStyle='#fff3cc';ctx.beginPath();ctx.arc(580,H*.18+camera*.1,46,0,7);ctx.fill();ctx.globalAlpha=1;}
const fy=floorY()+camera;ctx.save();ctx.translate(0,camera);ctx.fillStyle=place.wall;ctx.fillRect(0,floorY()-270,W,295);ctx.strokeStyle='#fff8';ctx.lineWidth=5;for(let i=0;i<5;i++){rect(i*185-70,floorY()-260,145,170,65,'#fff6',place.trim);}rect(0,floorY()-78,W,10,5,'#d9c5d9');ctx.fillStyle='#f5dfe5';ctx.fillRect(0,floorY()+55,W,H);ctx.strokeStyle='#ffffff94';ctx.lineWidth=3;for(let y=floorY()+80;y<H;y+=70){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}for(let x=-600;x<1400;x+=160){ctx.beginPath();ctx.moveTo(360,floorY()+55);ctx.lineTo(x,H);ctx.stroke();}ctx.restore();}
function drawBelt(){const y=floorY();rect(-30,y-5,790,57,18,'#b5aac7','#a99aba');ctx.save();ctx.beginPath();ctx.rect(0,y,W,38);ctx.clip();ctx.fillStyle='#ded4e6';const offset=(totalTime*(rule.speed||150))%90;for(let x=-100;x<850;x+=90){ctx.beginPath();ctx.moveTo(x-offset,y);ctx.lineTo(x+32-offset,y);ctx.lineTo(x+58-offset,y+38);ctx.lineTo(x+26-offset,y+38);ctx.fill();}ctx.restore();for(let x=10;x<740;x+=43){ctx.fillStyle='#9285a6';ctx.beginPath();ctx.arc(x,y+46,12,0,7);ctx.fill();ctx.strokeStyle='#cbbdd9';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x-7*Math.cos(totalTime*3),y+46-7*Math.sin(totalTime*3));ctx.lineTo(x+7*Math.cos(totalTime*3),y+46+7*Math.sin(totalTime*3));ctx.stroke();}rect(-20,y+56,760,20,8,'#b88faa');}
function drawHero(){if(!hero)return;let key='hero-'+CFG.location+'-back'+(Math.floor(totalTime*4)%4),rotation=0,scale=1;if(phase==='flight'){key='hero-'+CFG.location+'-'+(age<.13?'launch':age>.32&&grade==='perfect'?'air-front':'air');scale=grade==='perfect'?mix(1,.13,ease(age/flight.duration)):1-age/flight.duration*.25;rotation=grade==='perfect'?Math.sin(age*4)*.24:age*(grade==='bad'?3:1.5);for(let i=0;i<trails.length;i++){const t=trails[i],a=(i+1)/trails.length*.12;sprite('hero-'+CFG.location+'-air',t.x,t.y,220*scale,220*scale,.5,310/320,rotation,a);}}
if(phase==='approach'||phase==='windup'){const py=hero.y;ctx.strokeStyle='#b3a0bd';ctx.lineWidth=12;ctx.beginPath();ctx.moveTo(hero.x-35,floorY());ctx.lineTo(hero.x-35,py);ctx.moveTo(hero.x+35,floorY());ctx.lineTo(hero.x+35,py);ctx.stroke();rect(hero.x-80,py-4,160,22,9,'#fff0c9','#d7b6a5');rect(hero.x-65,py+17,130,18,6,'#d9a9b7');}
sprite(key,hero.x,hero.y,220*scale,220*scale,.5,310/320,rotation);}
function drawBatter(){let frame=0;if(swing){const t=swing.age;frame=t<.035?1:t<.075?2:t<.15?3:t<.45?4:0;}const override=images['batter-override-'+frame];const key=override?'batter-override-'+frame:'batter-'+place.row+'-'+frame;sprite(key,145,floorY()-2,470*.95,355*.95,220/470,342/355);}
function particleShape(p){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.color;if(p.kind===0){ctx.beginPath();for(let i=0;i<10;i++){const r=i%2?p.size*.4:p.size,a=i*Math.PI/5-Math.PI/2;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}ctx.closePath();ctx.fill();}else if(p.kind===1){const s=p.size;ctx.beginPath();ctx.moveTo(0,s*.4);ctx.bezierCurveTo(-s*1.3,-s*.5,-s*.6,-s*1.4,0,-s*.5);ctx.bezierCurveTo(s*.6,-s*1.4,s*1.3,-s*.5,0,s*.4);ctx.fill();}else if(p.kind===2)ctx.fillRect(-p.size/2,-p.size/3,p.size,p.size*.6);else{ctx.beginPath();ctx.arc(0,0,p.size*.4,0,7);ctx.fill();}ctx.restore();}
// Screen-space sticker slot: below the belt, clear of characters and flight camera.
function drawCheerSticker(id){const im=images['cheer-'+id];if(!im?.naturalWidth)return;const width=Math.min(250,140*im.width/im.height),height=width*im.height/im.width;ctx.drawImage(im,W-24-width,H-58-height,width,height);}
function drawCheer(){ctx.save();ctx.globalAlpha=clamp(age/.12,.35,1);drawCheerSticker(flight.cheerId);ctx.restore();}
function draw(){const sx=canvas.width/W;ctx.setTransform(sx,0,0,sx,0,0);ctx.clearRect(0,0,W,H);drawBackground();ctx.save();if(shake)ctx.translate(rand(-shake,shake),rand(-shake,shake));ctx.translate(0,camera);drawBelt();drawHero();drawBatter();for(const r of rings){ctx.globalAlpha=r.life/r.max;ctx.strokeStyle='#fff8c3';ctx.lineWidth=8;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,7);ctx.stroke();}ctx.globalAlpha=1;particles.forEach(particleShape);for(const s of stickers){const im=images['fx-'+s.id],p=1-s.life/s.max,scale=p<.16?mix(.3,1.14,p/.16):p<.3?mix(1.14,1,(p-.16)/.14):1;ctx.save();ctx.translate(s.x,s.y-p*36);ctx.rotate(s.rotation);ctx.globalAlpha=clamp(s.life/.2,0,1);if(im?.naturalWidth){const h=s.size*im.height/im.width;ctx.drawImage(im,-s.size*scale/2,-h*scale/2,s.size*scale,h*scale);}ctx.restore();}
ctx.restore();
if(phase==='miss')drawCheerSticker('miss');
if(phase==='approach'&&age<1.15)drawCheerSticker(round===1?'challenge':'next');
if(phase==='flight'){drawCheer();const distance=Math.round(flight.distance*ease(age/flight.duration));text(distance+'m',W*.76,H*.33,grade==='perfect'?67:48,grade==='perfect'?'#bd719a':'#8a82ad');if(grade==='perfect'&&age>.5){ctx.strokeStyle='#ffffffa0';ctx.lineWidth=3;for(let i=0;i<13;i++){const x=(i*137)%720,y=((totalTime*570+i*159)%H);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-5,y+80);ctx.stroke();}}}
if(phase==='between'&&round<5&&age<.5)text((round+1)+' / 5',W/2,H*.37,47,'#b782a8');if(flash>0){ctx.fillStyle='rgba(255,250,225,'+flash+')';ctx.fillRect(0,0,W,H);}}
function setPause(value){if(phase==='ready'||phase==='done')return;paused=!!value;last=null;if(paused){cancelAnimationFrame(raf);raf=0;Sound.suspend();if(solo)$('paused').hidden=false;}else{$('paused').hidden=true;Sound.unlock();run();}}
function close(){cancelAnimationFrame(raf);raf=0;Sound.stop();paused=false;phase='ready';hero=flight=swing=null;camera=0;particles=[];stickers=[];trails=[];rings=[];for(const id of ['paused','result'])$(id).hidden=true;$('intro').hidden=false;send('wellness-close');draw();}
async function loadImage(k,src){if(!src)return;try{const im=new Image();im.src=src;await im.decode();images[k]=im;}catch{}}
async function load(){await Promise.all(Object.entries(ASSETS).map(([k,v])=>loadImage(k,v)));await overrides();loaded=true;settings();$('start').disabled=false;$('start').textContent='시작';resize();if(!solo){document.body.classList.add('embedded');$('intro').hidden=true;readyCount++;send('wellness-ready');}draw();}
async function overrides(){const a=Array.isArray(CFG.images)?CFG.images:[];if(a[0])await loadImage('background',a[0]);if(a[1])for(let i=0;i<4;i++)await loadImage('hero-'+CFG.location+'-back'+i,a[1]);if(a[2])for(const name of ['launch','air','air-front'])await loadImage('hero-'+CFG.location+'-'+name,a[2]);await Promise.all(a.slice(3,9).map((src,i)=>loadImage('batter-override-'+i,src)));if(CFG.sounds)Object.assign(AUDIO,CFG.sounds);}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();input();});addEventListener('keydown',e=>{if(e.code==='Space'&&!e.target.matches('button,input,select')){e.preventDefault();input();}});
$('start').onclick=begin;$('again').onclick=begin;$('close').onclick=close;$('pause').onclick=()=>setPause(true);$('resume').onclick=()=>setPause(false);$('restart').onclick=begin;$('back').onclick=close;$('sound').onclick=()=>{mute=!mute;$('sound').textContent=mute?'×♪':'♪';$('sound').setAttribute('aria-label',mute?'소리 켜기':'소리 끄기');if(mute)Sound.stop();else Sound.unlock();};
for(const [id,key]of [['locations','location'],['difficulties','difficulty']])$(id).addEventListener('click',e=>{const b=e.target.closest('[data-'+key+']');if(!b)return;CFG[key]=key==='difficulty'?+b.dataset[key]:b.dataset[key];settings();draw();});
addEventListener('message',e=>{if(solo||e.source!==parent)return;if(e.data?.type==='wellness-start')begin();if(e.data?.type==='wellness-pause')setPause(true);if(e.data?.type==='wellness-resume')setPause(false);});
document.addEventListener('visibilitychange',()=>{last=null;if(document.hidden){Sound.stop();Sound.suspend();}else if(!paused)run();});addEventListener('pagehide',()=>{cancelAnimationFrame(raf);raf=0;Sound.stop();});addEventListener('resize',resize);
window.BattingGame={start:begin,pause:setPause,get state(){return{phase,age,round,score,combo,paused,reported,records:records.map(r=>({...r})),target:hero?{x:hero.x,y:hero.y-55,hitX:370,hitY:strikeY(),speed:rule.speed,window:rule.window}:null,flight:flight?{distance:flight.distance,duration:flight.duration,cheer:flight.cheer,cheerId:flight.cheerId}:null,effects:{stickers:stickers.length,particles:particles.length,camera},audio:{state:Sound.state,active:Sound.active},readyCount};}};
settings();resize();load();
})();
</script></body></html>
