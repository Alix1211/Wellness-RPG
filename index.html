<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GAIA CITY</title>
<style>body{margin:0;background:#fff2ef;color:#79516a;font:16px system-ui;display:grid;place-items:center;height:100vh}</style>
<div id="loading">GAIA CITY…</div>
<script>
(async()=>{
 try{
  const r=await fetch('builds/gaia-life-20261020/manifest.json');
  if(!r.ok)throw Error('manifest');
  const m=await r.json();
  const pieces=await Promise.all(m.parts.map(async p=>{const r=await fetch(p);if(!r.ok)throw Error(p);return r.arrayBuffer()}));
  const data=await new Response(new Blob(pieces).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
  const hash=async x=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',x)),b=>b.toString(16).padStart(2,'0')).join('');
  if(data.byteLength!==m.size||await hash(data)!==m.sha256)throw Error('R60 checksum');
  let html=new TextDecoder().decode(data);
  if(m.transform){
   if(m.transform!=='r60-controls-cast')throw Error('transform');
   const p=await import('./src/gaia-life/r60-controls-fix.mjs');
   html=p.fixR60Controls(html);
   const b=new TextEncoder().encode(html);
   if(b.byteLength!==m.output_size||await hash(b)!==m.output_sha256)throw Error('controls checksum');
  }
  if(m.quest_transform==='gaia-quest-rhythm-v1'){
   const patch=await import('./src/gaia-life/quest-rhythm-transform.mjs');
   html=patch.fixQuestRhythm(html);
   const b=new TextEncoder().encode(html);
   if(b.byteLength!==m.quest_output_size||await hash(b)!==m.quest_output_sha256)throw Error('quest rhythm checksum');
  }
  if(m.living_transform==='gaia-living-corridors-v1'){
   const patch=await import('./src/gaia-life/living-corridors-transform.mjs');
   html=patch.fixLivingCorridors(html);
   const b=new TextEncoder().encode(html);
   if(b.byteLength!==m.living_output_size||await hash(b)!==m.living_output_sha256)throw Error('living corridors checksum');
  }
  if(m.story_transform==='gaia-cohab-ending-v1'){
   const patch=await import('./src/gaia-life/cohab-ending-patch.mjs');
   const response=await fetch('./src/gaia-life/cohab-ending-runtime.js');
   if(!response.ok)throw Error('cohab runtime');
   html=patch.fixCohabEnding(html,await response.text());
   const b=new TextEncoder().encode(html);
   if(b.byteLength!==m.story_output_size||await hash(b)!==m.story_output_sha256)throw Error('cohab checksum');
  }
  if(m.toilet_transform==='gaia-toilet-tiles-v1'){
   const patch=await import('./src/gaia-life/toilet-art-transform.mjs');
   html=patch.fixToiletTiles(html);
   const b=new TextEncoder().encode(html);
   if(b.byteLength!==m.toilet_output_size||await hash(b)!==m.toilet_output_sha256)throw Error('toilet tiles checksum');
  }
  document.open();document.write(html);document.close();
 }catch(e){document.querySelector('#loading').textContent='실행 파일 복원: python3 tools/gaia/restore.py';console.error(e)}
})();
</script>
</html>
