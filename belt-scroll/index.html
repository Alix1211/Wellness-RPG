<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#de96b1"><title>GAIA CITY: DETECTIVE · 뒷골목 / 클럽</title><link rel="stylesheet" href="style.css"></head><body>

저장 · E를 누르고 떼기"><img data-art="button_lower" alt=""><svg class="charge-mark" viewBox="0 0 64 64" aria-hidden="true"><path d="M12 18 6 26l9 2m37-10 6 8-9 2M24 5l8 11 8-11"/></svg></button></div><div class="action-group"><button id="punch" class="action" aria-label="가슴 공격"><img data-art="button_upper" alt=""></button><button id="kick" class="action" aria-label="엉덩이 공격"><img data-art="button_lower" alt=""></button><button id="jump" class="action" aria-label="점프"><img data-art="button_jump" alt=""></button><button id="guard" class="action" aria-label="막기"><img data-art="button_guard" alt=""></button></div></div>
