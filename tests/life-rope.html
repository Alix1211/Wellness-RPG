canvas.addEventListener('pointermove',e=>{if(e.pointerId!==pointer||!started||paused)return;e.preventDefault();const p=point(e);if(kind==='water')model.aim(p.x,p.y);else{if(lastCut&&Math.hypot(lastCut.x-p.x,lastCut.y-p.y)>2&&model.cut(lastCut,p))smack();lastCut=p;}});
function release(e){if(e.pointerId!==pointer)return;stopInput();}canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);canvas.addEventListener('lostpointercapture',release);
addEventListener('blur',()=>{stopInput();if(started)pause(true);});document.addEventListener('visibilitychange',()=>{if(document.hidden&&started)pause(true);last=performance.now();});addEventListener('pagehide',()=>{silence();ac?.close().catch(()=>{});});addEventListener('keydown',e=>{if(e.key==='Escape')pause(!paused);});
function round(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke();}}
function txt(t,x,y,size=20,color='#42685b',align='center'){ctx.fillStyle=color;ctx.font=`600 ${size}px system-ui`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(t,x,y);}
function fit(im,x,y,w,h,cover=true){if(!im)return;const s=(cover?Math.max:Math.min)(w/im.width,h/im.height);ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();ctx.drawImage(im,x+(w-im.width*s)/2,y+(h-im.height*s)/2,im.width*s,im.height*s);ctx.restore();}
function heart(x,y,size,color){ctx.save();ctx.translate(x,y);ctx.scale(size/32,size/32);ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(0,13);ctx.bezierCurveTo(-29,-7,-17,-27,0,-10);ctx.bezierCurveTo(17,-27,29,-7,0,13);ctx.fill();ctx.restore();}
function burst(x,y){fog=.75;for(let i=0;i<78;i++){const a=Math.random()*Math.PI*2,v=110+Math.random()*400;fx.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-80,life:.65+Math.random()*.55,max:1.2,size:8+Math.random()*20,heart:i%3!==0,color:['#ff7cb4','#f04f9c','#ffd2e5','#f5a8d2'][i%4]});}for(let k=0;k<3;k++){const xx=100+Math.random()*520,yy=100+Math.random()*460;for(let j=0;j<16;j++){const a=j/16*Math.PI*2;fx.push({x:xx,y:yy,vx:Math.cos(a)*(120+k*30),vy:Math.sin(a)*(120+k*30),life:.8,max:1,size:5,heart:false,color:'#ffabd4'});}}fx=fx.slice(-250);}
function drawWater(){for(const [i,t]of model.tiles.entries()){round(t.x,t.y,t.size,t.size,8,'#dae8de','#9bbdad');if(images['tile'+i])fit(images['tile'+i],t.x,t.y,t.size,t.size);else{const g=ctx.createLinearGradient(t.x,t.y,t.x+t.size,t.y+t.size);g.addColorStop(0,'#e5efe5');g.addColorStop(1,'#accbbb');round(t.x+5,t.y+5,t.size-10,t.size-10,5,g);txt(''+(i+1),t.x+22,t.y+22,16,'#6a8b7b');}ctx.strokeStyle='#fff';ctx.lineWidth=5;ctx.beginPath();ctx.arc(t.cx,t.cy,19,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#416b6380';ctx.fill();ctx.strokeStyle='#4a8880';ctx.lineWidth=2;ctx.stroke();const gx=i%2===0?48:656;round(gx,t.y,16,t.size,8,'#c7d8ce');round(gx,t.y+t.size*(1-t.fill/100),16,t.size*t.fill/100,6,'#69b0bc');txt(Math.floor(t.fill)+'%',gx+8,t.y+t.size+17,15,'#466f61');}
 for(const p of model.particles){ctx.fillStyle='#60b9e4bb';ctx.beginPath();ctx.ellipse(p.x,p.y,3.8,6,.3,0,Math.PI*2);ctx.fill();}
 const o=model.muzzle,ang=Math.atan2(model.target.y-o.y,model.target.x-o.x)+Math.PI/2;ctx.save();ctx.translate(o.x,o.y);ctx.rotate(ang);if(images.gun)fit(images.gun,-45,-22,90,85,false);else{round(-12,-15,24,48,5,'#6faec2');round(-42,13,44,24,12,'#a2cba6');round(-8,32,16,25,4,'#578591');}ctx.restore();txt('누른 채 이동해 조준',360,704,17,'#739182');}
function drawRope(){const p=model.ball;txt((ropeIndex+1)+' / '+M.LEVELS.length+'   '+M.LEVELS[ropeIndex].name,360,26,20);for(const o of model.obstacles){round(o.x,o.y,o.w,o.h,7,'#a9beb1','#789b89');for(let x=o.x+12;x<o.x+o.w;x+=18){ctx.strokeStyle='#dce8df';ctx.beginPath();ctx.moveTo(x,o.y+4);ctx.lineTo(x+9,o.y+o.h-4);ctx.stroke();}}
 for(const r of model.ropes){round(r.x-14,r.y-8,28,16,5,'#6b8d7e');if(!r.cut){ctx.strokeStyle='#9a8157';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(r.x,r.y);ctx.lineTo(p.x,p.y);ctx.stroke();ctx.strokeStyle='#dbc69b';ctx.lineWidth=1;ctx.stroke();}}
 if(images.ball)fit(images.ball,p.x-p.r,p.y-p.r,p.r*2,p.r*2,false);else{const g=ctx.createRadialGradient(p.x-7,p.y-9,2,p.x,p.y,p.r);g.addColorStop(0,'#fff9e6');g.addColorStop(.3,'#e3be7c');g.addColorStop(1,'#a77b49');ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}
 const goal=model.goal;ctx.fillStyle='#446e6688';ctx.beginPath();ctx.ellipse(goal.x,goal.y,goal.width/2,19,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#77b8a2';ctx.lineWidth=8;ctx.stroke();txt('목표 입구',360,692,18);for(const f of model.cutFX){txt('✂',f.x,f.y,30,'#68998c');}if(lastCut){ctx.strokeStyle='#fff9';ctx.lineWidth=2;ctx.beginPath();ctx.arc(lastCut.x,lastCut.y,12,0,Math.PI*2);ctx.stroke();}}
function drawCylinder(){round(142,55,530,570,18,'#d9e7de','#b5ccbe');if(images.main)fit(images.main,142,55,530,570,false);else{const g=ctx.createLinearGradient(260,0,505,0);g.addColorStop(0,'#b0c9be');g.addColorStop(.45,'#edf4ea');g.addColorStop(1,'#92b5a5');round(280,100,230,450,40,g,'#90b4a2');round(265,92,260,44,16,'#a8c5b3');round(265,520,260,44,16,'#a8c5b3');for(const p of model.points){ctx.strokeStyle='#9bb4a080';ctx.setLineDash([4,6]);ctx.beginPath();ctx.arc(p.x,p.y,34,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);}}
 const x=56,y=87,h=520;round(x,y,44,h,16,'#c4d6c9');const py=v=>y+h*(1-v/100);round(x,py(model.pressure),44,h*model.pressure/100,12,model.pressure>82?'#e2848d':'#75b5aa');ctx.fillStyle='#9acaac44';ctx.fillRect(x-5,py(72),54,h*.4);for(const v of [0,32,72,82,100]){ctx.strokeStyle=v===82?'#c75f73':'#91afa1';ctx.lineWidth=v===82?5:2;ctx.beginPath();ctx.moveTo(x-7,py(v));ctx.lineTo(x+51,py(v));ctx.stroke();txt(v,x+63,py(v),14,v===82?'#b85366':'#658577','left');}txt('리듬',78,46,18);txt('연타 ↗   손 떼면 ↘',400,669,19);if(model.cooldown>0)txt('눈금 초과 · −45',400,702,20,'#b95873');else txt('하트: 안정구간 +45 / 그 외 +10',400,702,17,'#7a9687');for(const hrt of model.hearts){const pulse=1+Math.sin(hrt.life*10)*.1;ctx.fillStyle='#fff6';ctx.beginPath();ctx.arc(hrt.x,hrt.y,38*pulse,0,Math.PI*2);ctx.fill();heart(hrt.x,hrt.y,46*pulse,'#ed69a5');}}
function draw(){ctx.clearRect(0,0,720,720);const g=ctx.createLinearGradient(0,0,0,720);g.addColorStop(0,'#f3f7ed');g.addColorStop(1,'#dcece0');ctx.fillStyle=g;ctx.fillRect(0,0,720,720);if(images.bg)fit(images.bg,0,0,720,720);ctx.save();if(shake>0)ctx.translate(Math.sin(performance.now()*.06)*shake*9,0);if(kind==='water')drawWater();else if(kind==='rope')drawRope();else drawCylinder();ctx.restore();if(fog>0){ctx.fillStyle=`rgba(255,136,190,${fog*.24})`;ctx.fillRect(0,0,720,720);for(let i=0;i<4;i++){const x=130+i*170,y=250+Math.sin(i+fog)*160,r=ctx.createRadialGradient(x,y,10,x,y,230);r.addColorStop(0,`rgba(255,154,205,${fog*.25})`);r.addColorStop(1,'rgba(255,154,205,0)');ctx.fillStyle=r;ctx.fillRect(0,0,720,720);}}
 for(const p of fx){ctx.globalAlpha=Math.max(0,p.life/p.max);if(p.heart)heart(p.x,p.y,p.size,p.color);else{ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();}}ctx.globalAlpha=1;
 Q('#time').textContent=kind==='rope'?Math.floor(model.time)+'초':Math.ceil(model.left)+'초';Q('#score').textContent=kind==='water'?Math.floor(model.caught)+' / 400':kind==='rope'?model.cuts+'줄 절단':Math.floor(model.score)+' / '+model.goal;
}
function tick(t){const dt=Math.min(.04,(t-(last||t))/1000);last=t;if(started&&!paused&&!document.hidden){model.update(dt);if(kind==='water'&&model.shooting&&t-lastWaterAudio>650){voice();lastWaterAudio=t;}if(kind==='cylinder'){for(const e of model.events.splice(0)){if(e.type==='heart')burst(e.x,e.y);else shake=.7;}}fx.forEach(p=>{p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=70*dt;});fx=fx.filter(p=>p.life>0);fog=Math.max(0,fog-dt);shake=Math.max(0,shake-dt);if(model.done)finish();}draw();requestAnimationFrame(tick);}
model=makeModel();overlay(titles[kind],tips[kind],'시작',begin);loadArt();requestAnimationFrame(tick);
window.LifeMini={get model(){return model;},begin,pause,get paused(){return paused;},get started(){return started;},get images(){return images;},get effects(){return fx;},get sound(){return{enabled:soundOn,buffers:audioBuffers.filter(Boolean).length,active:activeSources.length};},setLevel(i){ropeIndex=i;begin();},kind};
})();
