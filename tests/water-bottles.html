<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>물병 채우기 · Wellness RPG</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f1f6f2;color:#254d5c;font-family:system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:14px;background:#d9e9e7;color:#2b5c69;padding:12px 20px;font-weight:700;touch-action:none}button:focus-visible,input:focus-visible{outline:3px solid #f4a947;outline-offset:3px}.water-game{max-width:1100px;margin:auto;padding:18px 26px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-right:90px}header small{font-size:11px;letter-spacing:2px;color:#6d9097}h1{font-size:27px;margin:3px 0}.water-rule{font-size:14px;margin:10px 0}.water-stats{display:flex;gap:12px;margin:12px 0}.water-stats span{background:white;border:1px solid #dce8e6;border-radius:12px;padding:9px 15px;font-size:13px}.water-stats b{margin-left:10px;font-size:20px}.water-stats span:nth-child(2) b{color:#b67c5b}.water-board{position:relative;border-radius:20px;overflow:hidden;box-shadow:0 12px 36px #3b707015;border:1px solid #d6e4e2}.water-board canvas{display:block;width:100%;touch-action:none}.water-controls{display:grid;grid-template-columns:1fr 1fr 180px;gap:25px;align-items:center;margin-top:20px}.water-controls label{font-size:13px;font-weight:700}.water-controls output{float:right;color:#3c899c}.water-controls input{display:block;width:100%;margin:12px 0;accent-color:#399aab;touch-action:pan-x}.water-controls button{height:66px;background:#347f90;color:white;box-shadow:0 5px 0 #245c6a;user-select:none;-webkit-user-select:none}.water-controls button.held{background:#235c6a;transform:translateY(3px);box-shadow:0 2px 0 #245c6a}.water-tip{font-size:12px;color:#6d8990;text-align:center}.water-result{position:absolute;inset:0;background:#eff9f1e8;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;backdrop-filter:blur(4px)}.water-result[hidden]{display:none}.water-result h2{font-size:32px}.water-result button{background:#347f90;color:white}@media(max-width:600px){.water-game{padding:16px 12px}header{padding-right:0}h1{font-size:22px}header button{padding:10px}.water-stats{gap:5px}.water-stats span{flex:1;padding:8px;font-size:11px}.water-stats b{display:block;margin:2px 0 0;font-size:19px}.water-controls{grid-template-columns:1fr 1fr;gap:12px}.water-controls button{grid-column:1/-1;height:58px}.water-tip{font-size:10px}.water-result h2{font-size:23px}.water-result p{font-size:12px}}@media(max-height:600px) and (orientation:landscape){.water-game{padding:8px 18px;max-width:820px}header small,.water-tip{display:none}h1{font-size:18px}.water-rule{font-size:11px;margin:3px 0}.water-stats{margin:5px 0}.water-stats span{padding:3px 12px;font-size:11px}.water-stats b{font-size:15px}.water-board{width:min(100%,calc((100dvh - 168px)*1.85185));margin:auto}.water-controls{margin-top:8px;gap:18px;grid-template-columns:1fr 1fr 140px}.water-controls button{height:44px}.water-controls input{margin:6px 0}header button{padding:6px 12px}}
</style></head><body><main id="game"></main><script>/* Neutral water-bottle aiming game. No external assets or dependencies. */
(function(root){'use strict';
const DEFAULTS={width:1000,height:540,gravity:900,tank:600,rate:30,muzzle:{x:80,y:440},bottles:[300,490,680,870].map((x,i)=>({x,mouthY:[300,260,280,240][i],mouthWidth:54,width:100,bottom:490,capacity:100})),art:{gun:null,bottle:null}};
class Model{
 constructor(config={}){this.config={...DEFAULTS,...config,muzzle:{...DEFAULTS.muzzle,...config.muzzle},art:{...DEFAULTS.art,...config.art}};this.reset();}
 reset(){this.bottles=this.config.bottles.map(b=>({...b,fill:0}));this.drops=[];this.tank=this.config.tank;this.caught=0;this.spilled=0;this.angle=57;this.power=740;this.fire=false;this.paused=false;this.done=false;this.clock=0;this.emit=0;}
 shoot(){if(this.tank<=0||this.done)return;const a=this.angle*Math.PI/180;this.drops.push({x:this.config.muzzle.x,y:this.config.muzzle.y,vx:Math.cos(a)*this.power,vy:-Math.sin(a)*this.power});this.tank--;}
 step(dt){if(this.paused||this.done)return;dt=Math.min(dt,.05);this.clock+=dt;if(this.fire&&this.tank>0){this.emit+=dt*this.config.rate;while(this.emit>=1&&this.tank>0){this.shoot();this.emit--;}}else this.emit=0;
 const keep=[];for(const p of this.drops){const ox=p.x,oy=p.y;p.x+=p.vx*dt;p.y+=p.vy*dt+.5*this.config.gravity*dt*dt;p.vy+=this.config.gravity*dt;let consumed=false;
 // Only a descending crossing of the mouth accepts water. Body impacts spill.
 let hit=null;for(const b of this.bottles){if(p.y>oy&&oy<=b.mouthY&&p.y>=b.mouthY){const t=(b.mouthY-oy)/(p.y-oy),x=ox+(p.x-ox)*t;if(Math.abs(x-b.x)<=b.mouthWidth/2&&(!hit||t<hit.t))hit={b,t};}}
 // Segment-vs-body prevents high-speed droplets from tunnelling through bottles.
 let bodyT=Infinity;for(const b of this.bottles){const left=b.x-b.width/2,right=b.x+b.width/2,top=b.mouthY+24,bottom=b.bottom;let enter=0,exit=1;for(const [o,d,lo,hi] of [[ox,p.x-ox,left,right],[oy,p.y-oy,top,bottom]]){if(Math.abs(d)<1e-8){if(o<lo||o>hi){enter=2;break;}}else{let a=(lo-o)/d,z=(hi-o)/d;if(a>z)[a,z]=[z,a];enter=Math.max(enter,a);exit=Math.min(exit,z);}}if(enter<=exit&&enter<=1&&exit>=0)bodyT=Math.min(bodyT,enter);}
 if(hit&&hit.t<=bodyT){if(hit.b.fill<hit.b.capacity){hit.b.fill++;this.caught++;}else this.spilled++;consumed=true;}else if(bodyT!==Infinity||p.y>510||p.x>1020||p.x< -20){this.spilled++;consumed=true;}if(!consumed)keep.push(p);}
 this.drops=keep;if(this.bottles.every(b=>b.fill>=b.capacity)){this.fire=false;this.spilled+=this.drops.length;this.drops=[];this.done=true;}else if(this.tank===0&&this.drops.length===0){this.fire=false;this.done=true;}}
 get won(){return this.done&&this.bottles.every(b=>b.fill>=b.capacity)&&this.caught>this.spilled;}
}
function mount(host,config={}){const m=new Model(config);host.innerHTML=`<div class="water-game"><header><div><small>WATER LAB · 화장실 미션</small><h1>물병 채우기</h1></div><button data-pause>일시정지</button></header><p class="water-rule">물병 4개를 채우세요. 받은 물이 흘린 물보다 많아야 성공!</p><div class="water-stats"><span>받은 물 <b data-caught>0</b></span><span>흘린 물 <b data-spilled>0</b></span><span>남은 물 <b data-tank>600</b></span></div><div class="water-board"><canvas aria-label="물총 조준 화면. 화면을 드래그하거나 아래 슬라이더로 조준하세요."></canvas><div class="water-result" hidden><h2></h2><p></p><button data-retry>다시 도전</button></div></div><div class="water-controls"><label>각도 <output data-angle></output><input aria-label="발사 각도" data-angle-input type="range" min="20" max="85" step="0.1" value="57"></label><label>파워 <output data-power></output><input aria-label="발사 파워" data-power-input type="range" min="350" max="1150" value="740"></label><button data-fire>누르고 발사</button></div><p class="water-tip">화면 드래그로 조준 · 버튼을 누르는 동안 발사 · 방향키로 각도/파워 · Space로 발사</p></div>`;
 const $=s=>host.querySelector(s),c=$('canvas'),g=c.getContext('2d');c.width=1000;c.height=540;let alive=true,last=0,raf=0,firePointer=null,aimPointer=null,reported=false;
 const imgs={};for(const k of ['gun','bottle'])if(m.config.art[k]){const im=new Image();im.src=m.config.art[k];imgs[k]=im;}
 const stop=()=>{m.fire=false;firePointer=null;$('[data-fire]').classList.remove('held');};
 function sync(){for(const k of ['angle','power']){$(`[data-${k}]`).value=k==='angle'?Math.round(m[k])+'°':Math.round(m[k]);$(`[data-${k}-input]`).value=m[k];}}
 for(const k of ['angle','power'])$(`[data-${k}-input]`).oninput=e=>{m[k]=+e.target.value;sync();};
 const fire=$('[data-fire]');fire.onpointerdown=e=>{if(m.paused||m.done||firePointer!==null)return;e.preventDefault();firePointer=e.pointerId;fire.setPointerCapture(e.pointerId);m.fire=true;fire.classList.add('held');};fire.onpointerup=fire.onpointercancel=fire.onlostpointercapture=e=>{if(e.pointerId===firePointer)stop();};
 function aim(e){const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*1000-m.config.muzzle.x,y=m.config.muzzle.y-(e.clientY-r.top)/r.height*540;m.angle=Math.max(20,Math.min(85,Math.atan2(Math.max(0,y),Math.max(1,x))*180/Math.PI));m.power=Math.max(350,Math.min(1150,Math.hypot(x,y)*1.55));sync();}
 c.onpointerdown=e=>{if(aimPointer!==null)return;e.preventDefault();aimPointer=e.pointerId;c.setPointerCapture(e.pointerId);aim(e);};c.onpointermove=e=>{if(e.pointerId===aimPointer)aim(e);};c.onpointerup=c.onpointercancel=e=>{if(e.pointerId===aimPointer)aimPointer=null;};
 function pause(){stop();m.paused=!m.paused;$('[data-pause]').textContent=m.paused?'계속하기':'일시정지';}
 $('[data-pause]').onclick=pause;$('[data-retry]').onclick=()=>{stop();m.reset();reported=false;$('.water-result').hidden=true;$('[data-pause]').textContent='일시정지';sync();};
 function key(e){if(e.target.tagName==='INPUT')return;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)){e.preventDefault();if(e.key===' '){if(!m.paused&&!m.done)m.fire=true;}else{m.angle=Math.max(20,Math.min(85,m.angle+(e.key==='ArrowUp'?1:e.key==='ArrowDown'?-1:0)));m.power=Math.max(350,Math.min(1150,m.power+(e.key==='ArrowRight'?10:e.key==='ArrowLeft'?-10:0)));sync();}}}
 function up(e){if(e.key===' ')stop();}function blur(){stop();}function visibility(){stop();last=0;if(document.hidden&&!m.paused&&!m.done)pause();}
 addEventListener('keydown',key);addEventListener('keyup',up);addEventListener('blur',blur);document.addEventListener('visibilitychange',visibility);
 function rr(x,y,w,h,r,fill,stroke){g.beginPath();g.roundRect(x,y,w,h,r);if(fill){g.fillStyle=fill;g.fill();}if(stroke){g.strokeStyle=stroke;g.lineWidth=2;g.stroke();}}
 function text(t,x,y,size=20,color='#26556a'){g.fillStyle=color;g.font=`600 ${size}px system-ui`;g.textAlign='center';g.fillText(t,x,y);}
 function draw(){g.clearRect(0,0,1000,540);const bg=g.createLinearGradient(0,0,0,540);bg.addColorStop(0,'#e5f3f4');bg.addColorStop(1,'#fcfaf1');g.fillStyle=bg;g.fillRect(0,0,1000,540);g.strokeStyle='#cddfe055';g.lineWidth=1;for(let x=0;x<1000;x+=80){g.beginPath();g.moveTo(x,0);g.lineTo(x,510);g.stroke();}for(let y=30;y<510;y+=80){g.beginPath();g.moveTo(0,y);g.lineTo(1000,y);g.stroke();}rr(0,503,1000,37,0,'#a7c6c6');
 const a=m.angle*Math.PI/180;g.fillStyle='#468e9c88';for(let t=.06;t<2.4;t+=.08){const x=m.config.muzzle.x+Math.cos(a)*m.power*t,y=m.config.muzzle.y-Math.sin(a)*m.power*t+.5*m.config.gravity*t*t;if(x>1000||y>510)break;g.beginPath();g.arc(x,y,2.4,0,Math.PI*2);g.fill();}
 m.bottles.forEach((b,i)=>{const top=b.mouthY+25,h=b.bottom-top,level=b.fill/b.capacity;g.save();g.beginPath();g.roundRect(b.x-b.width/2,top,b.width,h,18);g.clip();g.fillStyle='#ffffff9c';g.fillRect(b.x-b.width/2,top,b.width,h);g.fillStyle='#54c5e0aa';g.fillRect(b.x-b.width/2,b.bottom-h*level,b.width,h*level);g.restore();rr(b.x-b.width/2,top,b.width,h,18,null,'#83b9c6');rr(b.x-b.mouthWidth/2,b.mouthY,b.mouthWidth,30,5,'#e4f8fa88','#83b9c6');if(imgs.bottle?.complete&&imgs.bottle.naturalWidth)g.drawImage(imgs.bottle,b.x-b.width/2,b.mouthY,b.width,b.bottom-b.mouthY);g.strokeStyle=b.fill>=b.capacity?'#56a67b':'#20a9c0';g.lineWidth=5;g.beginPath();g.moveTo(b.x-b.mouthWidth/2,b.mouthY);g.lineTo(b.x+b.mouthWidth/2,b.mouthY);g.stroke();text(String(i+1),b.x,b.mouthY-47,19);text(Math.round(level*100)+'%',b.x,b.mouthY-18,22);});
 g.save();g.translate(m.config.muzzle.x,m.config.muzzle.y);g.rotate(-a);if(imgs.gun?.complete&&imgs.gun.naturalWidth)g.drawImage(imgs.gun,-95,-35,100,70);else{rr(-80,-19,76,38,12,'#f5bd6d','#c89855');rr(-42,12,23,40,7,'#66a8b5');rr(-20,-9,20,18,4,'#4e8d9c');rr(-73,-27,36,14,6,'#dceef1');}g.restore();g.fillStyle='#258dbbdd';for(const p of m.drops){g.beginPath();g.ellipse(p.x,p.y,3,4,0,0,Math.PI*2);g.fill();}
 if(m.paused){rr(345,45,310,64,20,'#ffffffeb');text('일시정지',500,85,25);}
 for(const k of ['caught','spilled','tank'])$(`[data-${k}]`).textContent=m[k];if(m.done&&!reported){reported=true;stop();const result=$('.water-result');result.hidden=false;result.querySelector('h2').textContent=m.won?'미션 성공!':'다시 도전해 보세요';result.querySelector('p').textContent=`받은 물 ${m.caught} · 흘린 물 ${m.spilled} · ${m.bottles.filter(b=>b.fill>=b.capacity).length}/4병 완성`;config.onFinish?.({won:m.won,caught:m.caught,spilled:m.spilled,ratio:m.caught/400});}}
 function tick(now){if(!alive)return;if(last)m.step(Math.min(.05,(now-last)/1000));last=now;draw();raf=requestAnimationFrame(tick);}sync();raf=requestAnimationFrame(tick);
 return {model:m,destroy(){alive=false;cancelAnimationFrame(raf);stop();removeEventListener('keydown',key);removeEventListener('keyup',up);removeEventListener('blur',blur);document.removeEventListener('visibilitychange',visibility);host.replaceChildren();}};
}
root.WaterBottles={Model,mount,DEFAULTS};if(typeof module!=='undefined')module.exports=root.WaterBottles;
})(typeof window!=='undefined'?window:globalThis);
</script><script>window.waterGame=WaterBottles.mount(document.querySelector("#game"),{onFinish(r){/*HOST_CALLBACK*/}});</script></body></html>
