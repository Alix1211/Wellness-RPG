async function mgLoad(){
 const jobs=[];const load=(group,key,src)=>{if(MG_IMAGES[group][key])return;jobs.push(new Promise(resolve=>{const im=new Image();im.onload=()=>{MG_IMAGES[group][key]=im;resolve();};im.onerror=()=>resolve();im.src=src;}));};
 for(const [kind,n] of [['animals',18],['sausages',6]])for(let i=1;i<=n;i++)load(kind,i-1,mgAsset(kind,i));
 for(const name of ['arms','back','hips','prone','bench','plank','tap1','tap2','tap3'])load('poses',name,mgDetail('poses',name));
 for(const name of ['body','surprise','tear','cry','blush'])load('portrait',name,mgDetail('portrait',name));
 for(const name of ['surprise','tear','cry','blush','calm'])load('actors',name,mgDetail('actors',name));
 for(let i=1;i<=24;i++)load('effects',i-1,mgAsset('effects',i));
 for(const name of [...Array.from({length:9},(_,i)=>'rear'+(i+1)),'ball','duck','slipper'])load('behind',name,mgDetail('behind',name));
 for(const name of ['run1','run2','run3','run4','jump1','jump2','jump3','jump4','floor','floor-mirror'])load('fetch',name,mgDetail('fetch',name));
 for(const name of ['cat','blind','cuffs'])load('fetch',name,itemUrl('상품',name));
 for(const [name,file] of Object.entries(MG_BOSS_FACES))load('boss',name,campaignAsset('boss',file+'.webp'));
 await Promise.all(jobs);
}
